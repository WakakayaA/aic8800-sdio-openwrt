name: Build M28K full firmware with AIC8800

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-yaml python3-pyelftools python3-pip rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves jq
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone OpenWrt 25.12 @ 6.12.94 and add M28K
        run: |
          git clone --filter=blob:none --no-checkout --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout 6bad5f2050
          grep LINUX_VERSION-6.12 target/linux/generic/kernel-6.12
          cat $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k-devices.mk >> target/linux/rockchip/image/armv8.mk
          KDT=target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p $KDT
          cp $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k-dts/*.dts* $KDT/
          echo "=== M28K in armv8.mk ==="
          grep -i m28k target/linux/rockchip/image/armv8.mk | head
          ls $KDT/ | grep m28

      - name: Update feeds
        run: |
          cd openwrt
          echo "src-cpy aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          sed -i 's|^src-git telephony|#src-git telephony|' feeds.conf.default
          sed -i 's|^src-git video|#src-git video|' feeds.conf.default
          ./scripts/feeds update -a 2>&1 | tail -20
          ./scripts/feeds install -a 2>&1 | tail -20

      - name: Configure M28K + aic8800
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=y" >> .config
          make defconfig
          echo "=== target config ==="
          grep -E "^CONFIG_TARGET" .config | head -10
          echo "=== aic8800/wpad selected? ==="
          grep -E "aic8800|wpad" .config | head

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s > /tmp/build.log 2>&1 || { echo "BUILD FAILED rc=$?"; tail -100 /tmp/build.log; exit 1; }
          echo "=== bin/targets/rockchip/armv8 ==="
          ls -la bin/targets/rockchip/armv8/

      - name: Collect images and logs
        if: always()
        run: |
          mkdir -p output
          cp /tmp/build.log output/build.log 2>/dev/null || true
          find openwrt/bin/targets/rockchip/armv8/ -maxdepth 1 -type f \( -name '*.img.gz' -o -name '*.img' \) -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m28k-openwrt-firmware
          path: output/*
          if-no-files-found: warn
