name: Build M28K kmods (tproxy/tun/socket/bbr) [kernel-hash-matched]

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-setuptools python3-yaml python3-pyelftools python3-pip rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves jq
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone ImmortalWrt 25.12 (same commit as board firmware)
        run: |
          git clone --filter=blob:none --no-checkout --branch openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git checkout 1d34e7b88708d4eeb3feabe0b2b6f835a909c9c0
          grep LINUX_VERSION-6.12 target/linux/generic/kernel-6.12

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -15
          ./scripts/feeds install -a 2>&1 | tail -15

      - name: Configure M28K + required kmods
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-socket=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
          make defconfig
          echo "=== selected kmods ==="
          grep -E "kmod-nft-tproxy|kmod-nft-socket|kmod-tun|kmod-nf-tproxy|kmod-nf-socket|kmod-nft-core|kmod-tcp-bbr" .config

      - name: Enable XFRM and full NAT in kernel config (match board firmware hash)
        run: |
          cd openwrt
          KCFG=target/linux/rockchip/armv8/config-6.12
          echo "" >> $KCFG
          echo "# XFRM (IPsec framework) - required by nf_nat" >> $KCFG
          echo "CONFIG_XFRM=y" >> $KCFG
          echo "CONFIG_XFRM_ALGO=y" >> $KCFG
          echo "CONFIG_XFRM_USER=y" >> $KCFG
          echo "CONFIG_XFRM_INTERFACE=y" >> $KCFG
          echo "CONFIG_NET_KEY=y" >> $KCFG
          echo "# Explicitly disable ESP offload to avoid NEW kconfig prompt" >> $KCFG
          echo "CONFIG_INET_ESP_OFFLOAD=n" >> $KCFG
          echo "# NAT core" >> $KCFG
          echo "CONFIG_NF_NAT=y" >> $KCFG
          echo "CONFIG_NF_NAT_MASQUERADE=y" >> $KCFG
          echo "CONFIG_NF_TABLES=y" >> $KCFG
          echo "CONFIG_NFT_MASQ=y" >> $KCFG
          echo "CONFIG_NFT_NAT=y" >> $KCFG
          echo "CONFIG_NFT_CHAIN_NAT=y" >> $KCFG
          echo "CONFIG_IP_NF_NAT=y" >> $KCFG
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> $KCFG
          echo "CONFIG_IP6_NF_NAT=y" >> $KCFG
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> $KCFG
          echo "# Transparent proxy support (Passwall2 tproxy/redirect)" >> $KCFG
          echo "CONFIG_IP_TRANSPARENT=y" >> $KCFG
          echo "CONFIG_NF_NAT_IPV4=y" >> $KCFG
          echo "CONFIG_NF_NAT_IPV6=y" >> $KCFG
          echo "CONFIG_NF_NAT_REDIRECT=y" >> $KCFG
          echo "CONFIG_NFT_REDIR=y" >> $KCFG
          echo "CONFIG_NFT_TPROXY=y" >> $KCFG
          echo "CONFIG_NFT_SOCKET=y" >> $KCFG
          echo "CONFIG_NF_SOCKET_IPV4=y" >> $KCFG
          echo "CONFIG_NF_SOCKET_IPV6=y" >> $KCFG
          echo "CONFIG_NF_TPROXY_IPV4=y" >> $KCFG
          echo "CONFIG_NF_TPROXY_IPV6=y" >> $KCFG
          echo "CONFIG_TUN=y" >> $KCFG
          echo "=== XFRM entries added ==="
          grep -c "CONFIG_XFRM=y" $KCFG
          echo "=== clean and prepare kernel to run olddefconfig ==="
          make target/linux/clean V=s 2>&1 | tail -3
          make target/linux/prepare V=s 2>&1 | tail -5
          echo "=== run olddefconfig to resolve all NEW options ==="
          KDIR=$(ls -d build_dir/target-*/linux-*/linux-* 2>/dev/null | head -1)
          echo "Kernel dir: $KDIR"
          if [ -n "$KDIR" ] && [ -f "$KDIR/Makefile" ]; then
            make -C "$KDIR" olddefconfig ARCH=arm64 CROSS_COMPILE=aarch64-openwrt-linux-musl- 2>&1 | tail -10 || echo "olddefconfig failed, continuing anyway"
          fi

      - name: Build kmods
        run: |
          cd openwrt
          make -j$(nproc) V=s > /tmp/build.log 2>&1 || { echo "BUILD FAILED rc=$?"; tail -80 /tmp/build.log; exit 1; }
          echo "=== target packages ==="
          ls bin/targets/rockchip/armv8/packages/ 2>/dev/null | grep -E "kmod-(nft-tproxy|nft-socket|tun|nf-tproxy|nf-socket|nft-core|tcp-bbr)" || true
          echo "=== generic packages ==="
          find bin/packages -name "kmod-nft-tproxy*.apk" -o -name "kmod-nft-socket*.apk" -o -name "kmod-tun*.apk" -o -name "kmod-nf-tproxy*.apk" -o -name "kmod-nf-socket*.apk" -o -name "kmod-tcp-bbr*.apk" 2>/dev/null | head

      - name: Collect kmods
        run: |
          mkdir -p /tmp/kmods
          cd openwrt
          cp bin/targets/rockchip/armv8/packages/kmod-nft-tproxy*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-nft-socket*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-tun*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-nf-tproxy*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-nf-socket*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-nft-core*.apk /tmp/kmods/ 2>/dev/null || true
          cp bin/targets/rockchip/armv8/packages/kmod-tcp-bbr*.apk /tmp/kmods/ 2>/dev/null || true
          find bin/packages -name "kmod-nft-tproxy*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-nft-socket*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-tun*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-nf-tproxy*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-nf-socket*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-nft-core*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          find bin/packages -name "kmod-tcp-bbr*.apk" -exec cp {} /tmp/kmods/ \; 2>/dev/null || true
          echo "=== collected ==="
          ls -la /tmp/kmods/ || true
          echo "=== build.log tail ==="
          tail -30 /tmp/build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m28k-kmods
          path: /tmp/kmods/
          retention-days: 7
