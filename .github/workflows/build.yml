name: Build AIC8800 SDIO
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
env:
  OPENWRT_VERSION: v25.12.5
jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-dev \
            rsync swig unzip zlib1g-dev file wget qemu-utils libelf-dev
      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout v25.12.5
      - name: Download patches from radxa-pkg/aic8800
        run: |
          cd aic8800-sdio-openwrt/aic8800-sdio/patches
          RADXA_RAW="https://raw.githubusercontent.com/radxa-pkg/aic8800/main/debian/patches"
          declare -A MAP=(
            ["fix-sdio-firmware-path.patch"]="010-fix-sdio-firmware-path.patch"
            ["fix-sdio-fall-through.patch"]="020-fix-sdio-fall-through.patch"
            ["fix-debug-file-with-no-debug-symbols.patch"]="030-fix-debug-file-with-no-debug-symbols.patch"
            ["fix-linux-6.1-build.patch"]="040-fix-linux-6.1-build.patch"
            ["fix-linux-6.5-build.patch"]="050-fix-linux-6.5-build.patch"
            ["fix-linux-6.7-build.patch"]="060-fix-linux-6.7-build.patch"
            ["fix-linux-6.9-build.patch"]="070-fix-linux-6.9-build.patch"
            ["fix-linux-6.13-build.patch"]="080-fix-linux-6.13-build.patch"
            ["fix-linux-6.14-build.patch"]="090-fix-linux-6.14-build.patch"
            ["fix-linux-6.15-build.patch"]="100-fix-linux-6.15-build.patch"
            ["fix-linux-6.16-build.patch"]="110-fix-linux-6.16-build.patch"
            ["fix-linux-6.17-build.patch"]="120-fix-linux-6.17-build.patch"
            ["fix-linux-6.19-build.patch"]="130-fix-linux-6.19-build.patch"
            ["fix-vmalloc-not-include.patch"]="140-fix-vmalloc-not-include.patch"
          )
          for src in "${!MAP[@]}"; do
            dst="${MAP[$src]}"
            echo "Downloading $src -> $dst"
            curl -sL "$RADXA_RAW/$src" -o "$dst"
          done
      - name: Add aic8800-sdio feed
        run: |
          cd openwrt
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure for rockchip/armv8
        run: |
          cd openwrt
          wget -O .config https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8/config.buildinfo
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          make defconfig
      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s || make download -j1 V=s
      - name: Build toolchain and kernel
        run: |
          cd openwrt
          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s
          make target/linux/compile -j$(nproc) V=s
      - name: Prepare aic8800-sdio source
        run: |
          cd openwrt
          make package/aic8800-sdio/download V=s
          make package/aic8800-sdio/prepare V=s || true
      - name: Build aic8800-sdio packages
        run: |
          cd openwrt
          make package/aic8800-sdio/compile -j$(nproc) V=s
      - name: Collect packages
        run: |
          mkdir -p output
          find openwrt/bin/ -name "*aic8800*" -exec cp {} output/ \;
          ls -la output/
      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip_armv8
          path: output/*
