name: Build AIC8800 SDIO Kwrt 6.12.94

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kmod-aic8800-sdio (openwrt 25.12@6.12.94 + M28K exact kernel config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-yaml python3-pyelftools python3-pip \
            rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves jq
          python3 -c "import elftools; print('pyelftools OK')" || pip3 install --break-system-packages pyelftools || pip3 install pyelftools
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone openwrt 25.12 @ 6.12.94 era + add M28K device
        run: |
          # CRITICAL: checkout openwrt at commit 6bad5f2050 (kernel bumped to 6.12.94 on 2026-06-19).
          # At this commit ALL patches (generic + rockchip) are written for 6.12.94, so no conflicts.
          # Latest openwrt-25.12 is 6.12.103 whose patches conflict with pinned 6.12.94.
          # Use partial clone of openwrt-25.12 branch (blob:none) so historical commit
          # 6bad5f2050 (verified on openwrt-25.12 branch, 181 commits behind tip) can be checked out.
          git clone --filter=blob:none --no-checkout --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout 6bad5f2050
          grep LINUX_VERSION-6.12 target/linux/generic/kernel-6.12
          grep LINUX_KERNEL_HASH-6.12.94 target/linux/generic/kernel-6.12
          # Append M28K device definition from repo file (avoid YAML/heredoc conflict)
          cat $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k-devices.mk >> target/linux/rockchip/image/armv8.mk
          # Copy M28K board DTS files from repo into kernel tree
          KDT=target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p $KDT
          cp $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k-dts/*.dts* $KDT/
          ls $KDT/ | grep m28
          echo "=== M28K in armv8.mk ==="
          grep -i "m28k" target/linux/rockchip/image/armv8.mk | head -5
          echo "=== rockchip KERNEL_PATCHVER ==="
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile

      - name: Update feeds
        run: |
          cd openwrt
          echo "src-cpy aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          # Replace git.openwrt.org with GitHub mirrors (git.openwrt.org unreliable from GH Actions, 504)
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          cat feeds.conf.default
          # telephony/video feeds cause dump errors (freeswitch/kamailio/mesa) and aren't needed
          # Disable them to avoid breaking feeds update
          sed -i 's|^src-git telephony|#src-git telephony|' feeds.conf.default
          sed -i 's|^src-git video|#src-git video|' feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a 2>&1 | tail -30
          ./scripts/feeds install -a 2>&1 | tail -20
          echo "=== installed feeds ==="
          ls feeds/

      - name: Configure rockchip/armv8 with M28K
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> .config
          echo "CONFIG_PACKAGE_kmod-mac80211=m" >> .config
          # CRITICAL: Append M28K exact kernel config to rockchip config-6.12
          # so OpenWrt's kconfig.pl merges it into the kernel .config (this_module=1088).
          # Manual cp to $KDIR/.config gets overwritten by make target/linux/compile.
          cat $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k_kernel_config.txt >> target/linux/rockchip/config-6.12
          echo "=== M28K config appended, lines: $(wc -l < target/linux/rockchip/config-6.12) ==="
          make defconfig
          echo "=== TARGET config (diagnostic) ==="
          grep -E "^CONFIG_TARGET" .config | head -10
          echo "=== this_module-relevant options in final .config ==="
          grep -E "^CONFIG_MODULE_UNLOAD|^CONFIG_KALLSYMS|^CONFIG_TRIM_UNUSED_KSYMS" .config | head

      - name: Build kernel and mac80211
        run: |
          cd openwrt
          echo "Starting tools build at $(date)"
          make tools/install V=s -j$(nproc) > /tmp/tools.log 2>&1; echo "tools rc=$?"
          echo "Starting toolchain build at $(date)"
          make toolchain/install V=s -j$(nproc) > /tmp/toolchain.log 2>&1; echo "toolchain rc=$?"
          echo "Starting kernel build at $(date)"
          make target/linux/compile V=s -j$(nproc) > /tmp/kernel.log 2>&1; echo "kernel rc=$?"
          # NOTE: mac80211 is built LATER in Verify step, AFTER M28K kernel config override.
          # Building it here with default OpenWrt config causes cfg80211.ko to reference
          # module namespace symbols that M28K kernel (CONFIG_MODULE_ALLOW_MISSING_NAMESPACE_IMPORTS=n)
          # does not support -> "class 'ieee80211' does not have namespace" load failure.

      - name: Verify kernel config + build aic8800
        run: |
          cd openwrt
          # CRITICAL: must use TARGET kernel dir, NOT toolchain kernel dir.
          # find build_dir -maxdepth 4 returns BOTH toolchain/.../linux-6.12.94 (headers only)
          # and target/.../linux-rockchip_armv8/linux-6.12.94 (real kernel source used by module build).
          # head -1 picks the toolchain one, so M28K config gets applied to wrong dir -> this_module stays 704.
          KDIR=build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/linux-6.12.94
          echo "KDIR=$KDIR"
          ls -la "$KDIR/.config" 2>/dev/null || echo "KDIR .config not found!"
          echo "=== Default kernel .config (before M28K override) ==="
          grep -E "^CONFIG_MODULE_UNLOAD|^CONFIG_KALLSYMS|^CONFIG_BPF_SYSCALL|^CONFIG_PERF_EVENTS|^CONFIG_TRIM_UNUSED_KSYMS" "$KDIR/.config" | head
          echo "=== Kernel version ==="
          cat "$KDIR/include/config/kernel.release" 2>/dev/null || true

          # CRITICAL: Override kernel .config with M28K exact config DIRECTLY.
          # Do NOT use 'make target/linux/compile' again — it runs kconfig.pl which
          # regenerates .config from generic/config-6.12 + rockchip/config-6.12 +
          # rockchip/armv8/config-6.12, overwriting the M28K config (this_module stays 704).
          # Instead: copy M28K .config, then run 'make olddefconfig' + 'make prepare'
          # directly in the kernel source dir to regenerate headers with M28K config.
          cp $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k_kernel_config.txt "$KDIR/.config"
          echo "=== M28K config copied, checking key options ==="
          grep -E "^CONFIG_MODULE_UNLOAD|^CONFIG_KALLSYMS|^CONFIG_BPF_SYSCALL|^CONFIG_PERF_EVENTS|^CONFIG_TRIM_UNUSED_KSYMS" "$KDIR/.config" | head

          # Force regenerate headers with M28K config.
          # Do NOT delete Module.symvers — it's needed by modpost for dependency
          # packages (gpio-button-hotplug etc). M28K has CONFIG_MODVERSIONS=n so
          # the old CRCs are not checked at load time; modpost only needs symbol names.
          rm -rf "$KDIR/include/generated"

          # Regenerate kernel headers directly (bypasses OpenWrt kconfig.pl)
          TC_DIR=$(ls -d $PWD/staging_dir/toolchain-aarch64_generic_*_musl 2>/dev/null | head -1)
          echo "TC_DIR=$TC_DIR"
          export STAGING_DIR=$TC_DIR
          export PATH=$TC_DIR/bin:$PATH
          cd "$KDIR"
          make ARCH=arm64 CROSS_COMPILE=aarch64-openwrt-linux-musl- olddefconfig > /tmp/kernel_olddefconfig.log 2>&1
          echo "olddefconfig rc=$?"
          make ARCH=arm64 CROSS_COMPILE=aarch64-openwrt-linux-musl- prepare scripts > /tmp/kernel_prepare.log 2>&1
          echo "prepare rc=$?"
          make ARCH=arm64 CROSS_COMPILE=aarch64-openwrt-linux-musl- modules_prepare > /tmp/kernel_modules_prepare.log 2>&1
          echo "modules_prepare rc=$?"
          echo "=== Regenerated kernel version ==="
          cat include/config/kernel.release 2>/dev/null || true
          echo "=== Regenerated utsrelease ==="
          cat include/generated/utsrelease.h 2>/dev/null || true
          echo "=== Module.symvers exists? ==="
          ls -la Module.symvers 2>/dev/null || true
          cd -

          # Build mac80211 AFTER M28K config override, so cfg80211/mac80211/compat
          # are compiled with M28K exact kernel config (no module namespace symbols
          # that M28K kernel CONFIG_MODULE_ALLOW_MISSING_NAMESPACE_IMPORTS=n rejects).
          echo "Building mac80211 with M28K config at $(date)"
          make package/mac80211/compile V=s -j$(nproc) > /tmp/mac80211.log 2>&1; echo "mac80211 rc=$?"

          echo "Building aic8800 driver at $(date)"
          make package/aic8800-sdio/compile V=s -j$(nproc) > /tmp/aic8800.log 2>&1; echo "aic8800 rc=$?"

          echo "===== aic8800.log tail ====="
          tail -40 /tmp/aic8800.log 2>/dev/null || true
          echo "=== Built .ko check ==="
          find . -name "aic8800*.ko" 2>/dev/null | head
          echo "=== this_module size check (target should be 1088) ==="
          for ko in $(find . -name "aic8800*.ko" 2>/dev/null | head -2); do
            echo "checking $ko"
            readelf -SW "$ko" 2>/dev/null | grep this_module || true
            modinfo "$ko" 2>/dev/null | grep -E "vermagic|filename" || true
          done
          true

      - name: Collect kernel modules and firmware
        if: always()
        run: |
          set -e
          mkdir -p output
          echo "=== Finding aic8800 .ko files ==="
          find openwrt -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Finding mac80211/cfg80211/compat .ko (matching build) ==="
          find openwrt -path "*/mac80211-regular/*" -name "cfg80211.ko" -exec cp {} output/ \; 2>/dev/null || true
          find openwrt -path "*/mac80211-regular/*" -name "mac80211.ko" -exec cp {} output/ \; 2>/dev/null || true
          find openwrt -path "*/mac80211-regular/*" -name "compat.ko" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== All .ko in output ==="
          ls -la output/*.ko 2>/dev/null || true
          echo "=== Firmware ==="
          FW_SRC=$(find openwrt -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -1)
          echo "FW_SRC=$FW_SRC"
          if [ -n "$FW_SRC" ]; then
            mkdir -p output/firmware
            cp -rp "$FW_SRC" output/firmware/
          fi
          # Also copy prebuilt mac80211/cfg80211/compat from ImageBuilder - upload separately
          echo "=== Output tree ==="
          find output -type f | head -40
          mkdir -p output/logs
          cp /tmp/tools.log output/logs/ 2>/dev/null || true
          cp /tmp/toolchain.log output/logs/ 2>/dev/null || true
          cp /tmp/kernel.log output/logs/ 2>/dev/null || true
          cp /tmp/kernel_rebuild.log output/logs/ 2>/dev/null || true
          cp /tmp/mac80211.log output/logs/ 2>/dev/null || true
          cp /tmp/aic8800.log output/logs/ 2>/dev/null || true
          ls -la output/logs/ 2>/dev/null

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip-kwrt-kernel
          path: output/*
          if-no-files-found: warn
