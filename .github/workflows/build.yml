name: Build AIC8800 SDIO (SDK)
on:
  workflow_dispatch:

env:
  OPENWRT_VERSION: 25.12.5

jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8) via SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-yaml \
            python3-pip rsync swig unzip zlib1g-dev file wget zstd curl
          # pyelftools needed by OpenWrt kernel module build; install via pip if apt package missing
          sudo apt-get install -y python3-pyelftools 2>/dev/null || pip3 install --break-system-packages pyelftools || pip3 install pyelftools
          python3 -c "import elftools; print('pyelftools OK')"
      - name: Download OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/rockchip/armv8/openwrt-sdk-${OPENWRT_VERSION}-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "SDK URL: $SDK_URL"
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to download SDK..."
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
              -o openwrt-sdk.tar.zst "$SDK_URL" && break
            echo "Download attempt $i failed, retrying in 10s..."
            sleep 10
          done
          ls -la openwrt-sdk.tar.zst
          test -s openwrt-sdk.tar.zst || { echo "SDK file is empty"; exit 1; }
          zstd -t openwrt-sdk.tar.zst || { echo "SDK file is corrupted"; exit 1; }
          tar --zstd -xf openwrt-sdk.tar.zst
          mv openwrt-sdk-* sdk
          ls -la sdk/
      - name: Download patches from radxa-pkg/aic8800
        run: |
          cd aic8800-sdio-openwrt/aic8800-sdio/patches
          RADXA_RAW="https://raw.githubusercontent.com/radxa-pkg/aic8800/main/debian/patches"
          declare -A MAP=(
            ["fix-sdio-firmware-path.patch"]="010-fix-sdio-firmware-path.patch"
            ["fix-sdio-fall-through.patch"]="020-fix-sdio-fall-through.patch"
            ["fix-debug-file-with-no-debug-symbols.patch"]="030-fix-debug-file-with-no-debug-symbols.patch"
            ["fix-linux-6.1-build.patch"]="040-fix-linux-6.1-build.patch"
            ["fix-linux-6.5-build.patch"]="050-fix-linux-6.5-build.patch"
            ["fix-linux-6.7-build.patch"]="060-fix-linux-6.7-build.patch"
            ["fix-linux-6.9-build.patch"]="070-fix-linux-6.9-build.patch"
            ["fix-linux-6.13-build.patch"]="080-fix-linux-6.13-build.patch"
            ["fix-linux-6.14-build.patch"]="090-fix-linux-6.14-build.patch"
            ["fix-linux-6.15-build.patch"]="100-fix-linux-6.15-build.patch"
            ["fix-linux-6.16-build.patch"]="110-fix-linux-6.16-build.patch"
            ["fix-linux-6.17-build.patch"]="120-fix-linux-6.17-build.patch"
            ["fix-linux-6.19-build.patch"]="130-fix-linux-6.19-build.patch"
            ["fix-vmalloc-not-include.patch"]="140-fix-vmalloc-not-include.patch"
          )
          for src in "${!MAP[@]}"; do
            dst="${MAP[$src]}"
            echo "Downloading $src -> $dst"
            curl -fL --retry 3 --retry-delay 3 -sS "$RADXA_RAW/$src" -o "$dst" || echo "WARN: failed to download $src"
          done
          ls -la
      - name: Add aic8800-sdio feed
        run: |
          cd sdk
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure for rockchip/armv8
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> .config
          echo "CONFIG_PACKAGE_kmod-mac80211=m" >> .config
          make defconfig
      - name: Build aic8800-sdio packages
        run: |
          cd sdk
          make package/aic8800-sdio/compile -j$(nproc) V=s
      - name: Collect raw kernel modules and firmware
        run: |
          set -e
          mkdir -p output
          echo "=== Copying all relevant .ko files ==="
          # aic8800 driver modules
          find sdk -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          # cfg80211 / mac80211 / compat modules (from mac80211 backports build)
          find sdk -name "cfg80211.ko" -exec cp {} output/cfg80211.ko \; 2>/dev/null || true
          find sdk -name "mac80211.ko" -exec cp {} output/mac80211.ko \; 2>/dev/null || true
          find sdk -name "compat.ko" -exec cp {} output/compat.ko \; 2>/dev/null || true
          find sdk -name "cfg80211.ko" -exec cp {} output/ \; 2>/dev/null || true
          find sdk -name "mac80211.ko" -exec cp {} output/ \; 2>/dev/null || true
          find sdk -name "compat.ko" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Copying firmware files ==="
          find sdk -iname "*aic8800*" -path "*firmware*" -exec cp {} output/ \; 2>/dev/null || true
          # Try to extract firmware from apk if available
          if command -v apk >/dev/null 2>&1; then
            echo "apk tool available, extracting firmware package"
            for apkfile in $(find sdk -name "*aic8800*firmware*.apk" 2>/dev/null); do
              echo "Extracting $apkfile"
              cd /tmp && apk extract "$apkfile" 2>/dev/null || true
              find /tmp -name "*.fw" -o -name "*aic8800*" -type f 2>/dev/null | head -20
              cd -
            done
          fi
          echo "=== Looking for firmware blobs ==="
          find sdk -name "*.fw" -o -name "*.bin" 2>/dev/null | grep -i aic | head -20
          echo "=== Copying built ipk/apk packages if any ==="
          find sdk/bin -name "*aic8800*" -exec cp {} output/ \; 2>/dev/null || true
          find sdk/bin -name "*cfg80211*" -exec cp {} output/ \; 2>/dev/null || true
          find sdk/bin -name "*mac80211*" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== output content ==="
          ls -laR output/
      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip_armv8
          path: output/*
