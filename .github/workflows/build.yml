name: Build AIC8800 SDIO (Lede)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build kmod-aic8800-sdio (lede rockchip/armv8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-yaml python3-pyelftools python3-pip \
            rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves
          python3 -c "import elftools; print('pyelftools OK')" || pip3 install --break-system-packages pyelftools || pip3 install pyelftools
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone Lede full source (has native rockchip target with M28K)
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede
          cd lede
          git log --oneline -1
          echo "=== rockchip KERNEL_PATCHVER ==="
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile
          echo "=== M28K in armv8.mk ==="
          grep -i "m28k" target/linux/rockchip/image/armv8.mk | head -5

      - name: Update feeds
        run: |
          cd lede
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure rockchip/armv8
        run: |
          cd lede
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> .config
          echo "CONFIG_PACKAGE_kmod-mac80211=m" >> .config
          make defconfig
          echo "=== TARGET config (diagnostic) ==="
          grep -E "^CONFIG_TARGET" .config | head -20
          echo "=== Verify rockchip target ==="
          make info 2>/dev/null | grep -i "rockchip" | head -10 || echo "make info failed"

      - name: Build kernel and driver (long step)
        run: |
          cd lede
          echo "Starting host tools build at $(date)"
          make tools/install V=s -j$(nproc) 2>&1 | tee /tmp/tools.log | tail -20
          echo "=== tools done at $(date) ==="
          echo "Starting toolchain build at $(date)"
          make toolchain/install V=s -j$(nproc) 2>&1 | tee /tmp/toolchain.log | tail -20
          echo "=== toolchain done at $(date) ==="
          echo "Starting kernel + driver build at $(date)"
          timeout 300m make package/aic8800-sdio/compile V=s -j$(nproc) 2>&1 | tee /tmp/build_out.log | tail -100
          echo "Build finished at $(date)"
          echo "=== Built .ko check ==="
          find . -name "aic8800*.ko" 2>/dev/null | head
          find . -name "cfg80211.ko" -o -name "mac80211.ko" -o -name "compat.ko" 2>/dev/null | head

      - name: Collect kernel modules and firmware
        run: |
          set -e
          mkdir -p output
          echo "=== Finding .ko files ==="
          find lede -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          find lede -name "cfg80211.ko" -exec cp {} output/cfg80211.ko \; 2>/dev/null || true
          find lede -name "mac80211.ko" -exec cp {} output/mac80211.ko \; 2>/dev/null || true
          find lede -name "compat.ko" -exec cp {} output/compat.ko \; 2>/dev/null || true
          echo "=== Firmware ==="
          FW_SRC=$(find lede -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -1)
          echo "FW_SRC=$FW_SRC"
          if [ -n "$FW_SRC" ]; then
            mkdir -p output/firmware
            cp -rp "$FW_SRC" output/firmware/
          fi
          echo "=== .ko files ==="
          find output -name "*.ko" -exec ls -la {} \;
          echo "=== Output tree ==="
          find output -type f | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip-lede-kernel
          path: output/*
