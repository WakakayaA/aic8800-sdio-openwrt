name: Build AIC8800 SDIO (SDK)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8, lede kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-yaml python3-pyelftools python3-pip \
            rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves
          python3 -c "import elftools; print('pyelftools OK')" || pip3 install --break-system-packages pyelftools || pip3 install pyelftools
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone OpenWrt full source
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -1
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile

      - name: Apply Lede rockchip kernel (like Kwrt diy.sh)
        run: |
          cd openwrt
          # Replace rockchip target with lede version (this is what Kwrt uses)
          rm -rf package/boot target/linux/rockchip
          git clone --depth 1 --filter=blob:none --sparse https://github.com/coolsnowwolf/lede.git lede_tmp
          cd lede_tmp
          git sparse-checkout init --cone
          git sparse-checkout set target/linux/rockchip package/boot
          cd ..
          cp -rn lede_tmp/target/linux/rockchip target/linux/rockchip
          cp -rn lede_tmp/package/boot package/boot
          rm -rf lede_tmp
          echo "=== Fix rockchip Makefile (like Kwrt diy.sh) ==="
          # Remove KERNEL_TESTING_PATCHVER (6.18 not supported by official 25.12)
          sed -i '/KERNEL_TESTING_PATCHVER/d' target/linux/rockchip/Makefile
          # Fix DEFAULT_PACKAGES: replace lede-only packages with official-compatible ones
          sed -i '/DEFAULT_PACKAGES/d' target/linux/rockchip/Makefile
          sed -i '/include $(INCLUDE_DIR)\/target.mk/a DEFAULT_PACKAGES += uboot-envtools partx-utils e2fsprogs mkf2fs kmod-gpio-button-hotplug automount ethtool haveged usb-modeswitch' target/linux/rockchip/Makefile
          echo "=== KERNEL_PATCHVER ==="
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile
          echo "=== DEFAULT_PACKAGES ==="
          grep DEFAULT_PACKAGES target/linux/rockchip/Makefile
          echo "=== armv8 config exists ==="
          ls target/linux/rockchip/armv8/ | head

      - name: Update feeds
        run: |
          cd openwrt
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure rockchip/armv8
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> .config
          echo "CONFIG_PACKAGE_kmod-mac80211=m" >> .config
          make defconfig
          echo "=== TARGET config (diagnostic) ==="
          grep -E "^CONFIG_TARGET" .config | head -30
          echo "=== Verify rockchip target is recognized ==="
          make info 2>/dev/null | grep -A2 -i rockchip | head -20 || echo "make info failed"
          echo "=== Relevant packages ==="
          grep -E "aic8800|cfg80211|mac80211" .config | head -20

      - name: Build kernel and driver (long step)
        run: |
          cd openwrt
          echo "Starting host tools build at $(date)"
          # Build host tools first (this is what was missing - openssl, libdeflate-gzip etc)
          make tools/install V=s -j$(nproc) 2>&1 | tee /tmp/tools.log | tail -20
          echo "=== tools done at $(date) ==="
          # Build toolchain
          make toolchain/install V=s -j$(nproc) 2>&1 | tee /tmp/toolchain.log | tail -20
          echo "=== toolchain done at $(date) ==="
          # Now build the driver (kernel will be built as dependency)
          echo "Starting kernel + driver build at $(date)"
          timeout 300m make package/aic8800-sdio/compile V=s -j$(nproc) 2>&1 | tee /tmp/build_out.log | tail -100
          echo "Build finished at $(date)"
          # Check for built .ko files
          echo "=== Built .ko check ==="
          find . -name "aic8800*.ko" 2>/dev/null | head
          find . -name "cfg80211.ko" -o -name "mac80211.ko" -o -name "compat.ko" 2>/dev/null | head

      - name: Collect kernel modules and firmware
        run: |
          set -e
          mkdir -p output
          echo "=== Finding .ko files ==="
          find openwrt -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          find openwrt -name "cfg80211.ko" -exec cp {} output/cfg80211.ko \; 2>/dev/null || true
          find openwrt -name "mac80211.ko" -exec cp {} output/mac80211.ko \; 2>/dev/null || true
          find openwrt -name "compat.ko" -exec cp {} output/compat.ko \; 2>/dev/null || true
          echo "=== Firmware ==="
          FW_SRC=$(find openwrt -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -1)
          echo "FW_SRC=$FW_SRC"
          if [ -n "$FW_SRC" ]; then
            mkdir -p output/firmware
            cp -rp "$FW_SRC" output/firmware/
          fi
          echo "=== .ko files ==="
          find output -name "*.ko" -exec ls -la {} \;
          echo "=== Output tree ==="
          find output -type f | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip-lede-kernel
          path: output/*
