name: Build AIC8800 SDIO (Kwrt 6.12.94 exact)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kmod-aic8800-sdio (openwrt 25.12@6.12.94 + M28K exact kernel config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-yaml python3-pyelftools python3-pip \
            rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves jq
          python3 -c "import elftools; print('pyelftools OK')" || pip3 install --break-system-packages pyelftools || pip3 install pyelftools
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone openwrt 25.12 (kernel 6.12.94) + add M28K device
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b openwrt-25.12 openwrt
          cd openwrt
          # Pin kernel version to 6.12.94 (M28K runs this exact kernel)
          # NOTE: hash must match the actual downloaded linux-6.12.94.tar.xz (e998a232...)
          echo 'LINUX_VERSION-6.12 = .94' > target/linux/generic/kernel-6.12
          echo 'LINUX_KERNEL_HASH-6.12.94 = e998a232b9418db3301cb58468e291a4f41d6ab8306029b30d991f56251dc8d2' >> target/linux/generic/kernel-6.12
          cat target/linux/generic/kernel-6.12
          # CRITICAL: openwrt-25.12 branch patches are written for 6.12.103.
          # Pinning to 6.12.94 causes patch conflicts. Remove generic pending/hack patches
          # (non-essential for rockchip M28K; keeps mtk_eth_soc etc from conflicting).
          rm -f target/linux/generic/pending-6.12/*.patch
          rm -f target/linux/generic/hack-6.12/*.patch
          echo "=== remaining generic patches ==="
          ls target/linux/generic/pending-6.12/ 2>/dev/null | head
          ls target/linux/generic/hack-6.12/ 2>/dev/null | head
          # USE OPENWRT OFFICIAL rockchip target (don't copy lede's - it's incompatible and
          # caused fallback to mediatek). Just append the M28K device definition.
          # M28K = RK3528 SoC, armv8 subtarget (already supported by openwrt-25.12 rockchip)
          cat >> target/linux/rockchip/image/armv8.mk <<'EOF'

define Device/widora_mangopi-m28
  DEVICE_VENDOR := Widora
  SOC := rk3528
  UBOOT_DEVICE_NAME := generic-rk3528
  IMAGE/sysupgrade.img.gz := boot-common | boot-script | pine64-img | gzip | append-metadata
  DEVICE_PACKAGES := kmod-aic8800-sdio wpad-openssl -urngd
endef

define Device/widora_mangopi-m28c
$(call Device/widora_mangopi-m28)
  DEVICE_MODEL := MangoPi M28C
  DEVICE_PACKAGES += kmod-usb-serial-option
endef
TARGET_DEVICES += widora_mangopi-m28c

define Device/widora_mangopi-m28k
$(call Device/widora_mangopi-m28)
  DEVICE_MODEL := MangoPi M28K
  DEVICE_PACKAGES += kmod-r8168
endef
TARGET_DEVICES += widora_mangopi-m28k

define Device/widora_mangopi-m28k-pro
$(call Device/widora_mangopi-m28)
  DEVICE_MODEL := MangoPi M28K Pro
  DEVICE_PACKAGES += kmod-i2c-gpio kmod-r8125
endef
TARGET_DEVICES += widora_mangopi-m28k-pro
EOF
          echo "=== M28K in armv8.mk ==="
          grep -i "m28k" target/linux/rockchip/image/armv8.mk | head -5
          echo "=== rockchip KERNEL_PATCHVER ==="
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile

      - name: Update feeds
        run: |
          cd openwrt
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          # Replace git.openwrt.org with GitHub mirrors (git.openwrt.org unreliable from GH Actions, 504)
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          cat feeds.conf.default
          # telephony/video feeds cause dump errors (freeswitch/kamailio/mesa) and aren't needed
          # Disable them to avoid breaking feeds update
          sed -i 's|^src-git telephony|#src-git telephony|' feeds.conf.default
          sed -i 's|^src-git video|#src-git video|' feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a 2>&1 | tail -30
          ./scripts/feeds install -a 2>&1 | tail -20
          echo "=== installed feeds ==="
          ls feeds/

      - name: Configure rockchip/armv8 with M28K
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y" >> .config
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> .config
          echo "CONFIG_PACKAGE_kmod-mac80211=m" >> .config
          make defconfig
          echo "=== TARGET config (diagnostic) ==="
          grep -E "^CONFIG_TARGET" .config | head -10

      - name: Build kernel and mac80211
        run: |
          cd openwrt
          echo "Starting tools build at $(date)"
          make tools/install V=s -j$(nproc) > /tmp/tools.log 2>&1; echo "tools rc=$?"
          echo "Starting toolchain build at $(date)"
          make toolchain/install V=s -j$(nproc) > /tmp/toolchain.log 2>&1; echo "toolchain rc=$?"
          echo "Starting kernel build at $(date)"
          make target/linux/compile V=s -j$(nproc) > /tmp/kernel.log 2>&1; echo "kernel rc=$?"
          echo "Building mac80211 at $(date)"
          make package/mac80211/compile V=s -j$(nproc) > /tmp/mac80211.log 2>&1; echo "mac80211 rc=$?"

      - name: Rebuild kernel with M28K exact config, then build aic8800
        run: |
          cd openwrt
          # CRITICAL: Overlay the exact M28K kernel .config (this_module=1088)
          KDIR=$(find build_dir -maxdepth 4 -type d -name "linux-6.12.94" | head -1)
          echo "KDIR=$KDIR"
          if [ -z "$KDIR" ]; then
            echo "ERROR: kernel build dir not found"; find build_dir -maxdepth 5 -type d -name "linux-6.12*"; exit 1
          fi
          cp $GITHUB_WORKSPACE/aic8800-sdio-openwrt/m28k_kernel_config.txt "$KDIR/.config"
          echo "=== applied M28K config to $KDIR/.config ==="
          # Verify this_module-relevant options present
          grep -E "^CONFIG_MODULE_UNLOAD|^CONFIG_MODULE_DEBUG|^CONFIG_KALLSYMS" "$KDIR/.config" | head
          # Rebuild kernel with new config (regenerate Module.symvers, headers)
          make target/linux/compile V=s -j$(nproc) > /tmp/kernel_rebuild.log 2>&1; echo "kernel rebuild rc=$?"

          echo "Building aic8800 driver at $(date)"
          make package/aic8800-sdio/compile V=s -j$(nproc) > /tmp/aic8800.log 2>&1; echo "aic8800 rc=$?"

          echo "===== aic8800.log tail ====="
          tail -40 /tmp/aic8800.log 2>/dev/null || true
          echo "=== Built .ko check ==="
          find . -name "aic8800*.ko" 2>/dev/null | head
          find . -name "cfg80211.ko" -o -name "mac80211.ko" -o -name "compat.ko" 2>/dev/null | head
          echo "=== this_module size check (target should be 1088) ==="
          for ko in $(find . -name "aic8800*.ko" 2>/dev/null | head -2); do
            echo "checking $ko"
            # use readelf if available else modinfo
            readelf -SW "$ko" 2>/dev/null | grep this_module || true
          done
          true

      - name: Collect kernel modules and firmware
        if: always()
        run: |
          set -e
          mkdir -p output
          echo "=== Finding aic8800 .ko files ==="
          find openwrt -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          echo "=== Firmware ==="
          FW_SRC=$(find openwrt -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -1)
          echo "FW_SRC=$FW_SRC"
          if [ -n "$FW_SRC" ]; then
            mkdir -p output/firmware
            cp -rp "$FW_SRC" output/firmware/
          fi
          # Also copy prebuilt mac80211/cfg80211/compat from ImageBuilder - upload separately
          echo "=== Output tree ==="
          find output -type f | head -40
          mkdir -p output/logs
          cp /tmp/tools.log output/logs/ 2>/dev/null || true
          cp /tmp/toolchain.log output/logs/ 2>/dev/null || true
          cp /tmp/kernel.log output/logs/ 2>/dev/null || true
          cp /tmp/kernel_rebuild.log output/logs/ 2>/dev/null || true
          cp /tmp/mac80211.log output/logs/ 2>/dev/null || true
          cp /tmp/aic8800.log output/logs/ 2>/dev/null || true
          ls -la output/logs/ 2>/dev/null

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip-kwrt-kernel
          path: output/*
          if-no-files-found: warn
