name: Build AIC8800 SDIO (Full Source + Lede kernel)

on:
  workflow_dispatch:

env:
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8, lede kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get -qq autoremove --purge || true
          sudo apt-get -qq clean || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential clang flex bison \
            g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-yaml python3-pyelftools python3-pip \
            rsync swig unzip zlib1g-dev file wget zstd curl qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dwarves
          python3 -c "import elftools; print('pyelftools OK')" || pip3 install --break-system-packages pyelftools
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone OpenWrt full source
        run: |
          git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log --oneline -1
          ls target/linux/rockchip/

      - name: Apply Lede rockchip kernel (like Kwrt diy.sh)
        run: |
          cd openwrt
          # Replace rockchip target with lede version (this is what Kwrt uses)
          rm -rf package/boot target/linux/rockchip
          git clone --depth 1 --filter=blob:none --sparse https://github.com/coolsnowwolf/lede.git lede_tmp
          cd lede_tmp
          git sparse-checkout init --cone
          git sparse-checkout set target/linux/rockchip package/boot
          cd ..
          cp -rn lede_tmp/target/linux/rockchip target/linux/rockchip
          cp -rn lede_tmp/package/boot package/boot
          rm -rf lede_tmp
          # Verify
          head -30 target/linux/rockchip/Makefile
          ls target/linux/rockchip/armv8/ | head
          echo "KERNEL_PATCHVER check:"
          grep KERNEL_PATCHVER target/linux/rockchip/Makefile

      - name: Update feeds
        run: |
          cd openwrt
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure rockchip/armv8
        run: |
          cd openwrt
          cat > .config <<'EOF'
CONFIG_TARGET_rockchip=y
CONFIG_TARGET_rockchip_armv8=y
CONFIG_TARGET_rockchip_armv8_DEVICE_generic=y
CONFIG_PACKAGE_kmod-aic8800-sdio=m
CONFIG_PACKAGE_aic8800-sdio-firmware=m
CONFIG_PACKAGE_kmod-cfg80211=m
CONFIG_PACKAGE_kmod-mac80211=m
EOF
          make defconfig
          echo "=== Wireless config ==="
          grep -E "aic8800|cfg80211|mac80211|WIRELESS" .config

      - name: Prepare kernel (download + patch + config)
        run: |
          cd openwrt
          # This builds kernel metadata and downloads kernel source
          make target/linux/prepare V=s 2>&1 | tail -20 || true
          ls build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/ 2>/dev/null | head

      - name: Build kernel modules
        run: |
          cd openwrt
          # Build the aic8800-sdio packages (this will compile kernel first)
          make package/aic8800-sdio/compile V=s -j$(nproc) 2>&1 | tail -60

      - name: Collect kernel modules and firmware
        run: |
          set -e
          mkdir -p output
          echo "=== Finding .ko files ==="
          find openwrt -name "aic8800*.ko" -exec cp {} output/ \; 2>/dev/null || true
          find openwrt -name "cfg80211.ko" -exec cp {} output/cfg80211.ko \; 2>/dev/null || true
          find openwrt -name "mac80211.ko" -exec cp {} output/mac80211.ko \; 2>/dev/null || true
          find openwrt -name "compat.ko" -exec cp {} output/compat.ko \; 2>/dev/null || true
          echo "=== Firmware ==="
          find openwrt -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -3
          FW_SRC=$(find openwrt -type d -path "*driver_fw/fw/aic8800D80*" 2>/dev/null | head -1)
          if [ -n "$FW_SRC" ]; then
            mkdir -p output/firmware
            cp -rp "$FW_SRC" output/firmware/
          fi
          echo "=== .ko files found ==="
          find output -name "*.ko" -exec ls -la {} \;
          echo "=== Output tree ==="
          find output -type f | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip-lede-kernel
          path: output/*
