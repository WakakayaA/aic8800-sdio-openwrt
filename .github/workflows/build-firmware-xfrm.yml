name: Build M28K firmware with XFRM (NAT fix)

on:
  workflow_dispatch:

env:
  FEEDS: packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3-setuptools

      - name: Clone ImmortalWrt 25.12
        run: |
          git clone --depth 1 --branch openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add M28K device support and aic8800 driver
        run: |
          # Copy device definition
          cp m28k-devices.mk immortalwrt/target/linux/rockchip/image/
          # Copy device tree files
          mkdir -p immortalwrt/target/linux/rockchip/dts
          cp -v m28k-dts/*.dts immortalwrt/target/linux/rockchip/dts/ 2>/dev/null || true
          cp -v m28k-dts/*.dtsi immortalwrt/target/linux/rockchip/dts/ 2>/dev/null || true
          # Copy aic8800 driver package
          cp -r aic8800-sdio immortalwrt/package/

      - name: Configure target for M28K
        run: |
          cd immortalwrt
          cat > .config << 'EOF'
CONFIG_TARGET_rockchip=y
CONFIG_TARGET_rockchip_armv8=y
CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_widora_mangopi-m28k=y
CONFIG_PACKAGE_kmod-aic8800-sdio=y
CONFIG_PACKAGE_aic8800-sdio-firmware=y
CONFIG_PACKAGE_wpad-openssl=y
CONFIG_PACKAGE_kmod-r8168=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-app-firewall=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
EOF
          make defconfig

      - name: Enable XFRM in kernel config (fixes NAT/masquerade)
        run: |
          cd immortalwrt
          KCFG=target/linux/rockchip/armv8/config-6.12
          echo "" >> $KCFG
          echo "# XFRM (IPsec framework) - required for nf_nat" >> $KCFG
          echo "CONFIG_XFRM=y" >> $KCFG
          echo "CONFIG_XFRM_ALGO=y" >> $KCFG
          echo "CONFIG_XFRM_USER=y" >> $KCFG
          echo "CONFIG_XFRM_INTERFACE=y" >> $KCFG
          echo "CONFIG_INET_AH=y" >> $KCFG
          echo "CONFIG_INET_ESP=y" >> $KCFG
          echo "CONFIG_INET_IPCOMP=y" >> $KCFG
          echo "CONFIG_INET_XFRM_TUNNEL=y" >> $KCFG
          echo "CONFIG_INET_TUNNEL=y" >> $KCFG
          echo "CONFIG_INET6_XFRM_TUNNEL=y" >> $KCFG
          echo "CONFIG_INET6_ESP=y" >> $KCFG
          echo "CONFIG_INET6_AH=y" >> $KCFG
          echo "CONFIG_INET6_IPCOMP=y" >> $KCFG
          echo "CONFIG_NET_KEY=y" >> $KCFG
          echo "# NAT core" >> $KCFG
          echo "CONFIG_NF_NAT=y" >> $KCFG
          echo "CONFIG_NF_NAT_MASQUERADE=y" >> $KCFG
          echo "CONFIG_NF_TABLES=y" >> $KCFG
          echo "CONFIG_NFT_MASQ=y" >> $KCFG
          echo "CONFIG_NFT_NAT=y" >> $KCFG
          echo "CONFIG_NFT_CHAIN_NAT=y" >> $KCFG
          echo "CONFIG_IP_NF_NAT=y" >> $KCFG
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> $KCFG
          echo "CONFIG_IP6_NF_NAT=y" >> $KCFG
          echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> $KCFG
          # Verify
          grep -c "CONFIG_XFRM=y" $KCFG
          echo "Kernel config patched"

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) IGNORE_ERRORS=1 2>&1 | tail -100

      - name: List built images
        run: |
          ls -lh immortalwrt/bin/targets/rockchip/armv8/ 2>/dev/null || echo "No images found"
          find immortalwrt/bin -name "*m28k*" -o -name "*sysupgrade*" 2>/dev/null | head -20

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: m28k-firmware-xfrm
          path: |
            immortalwrt/bin/targets/rockchip/armv8/*sysupgrade*
            immortalwrt/bin/targets/rockchip/armv8/*factory*
            immortalwrt/bin/targets/rockchip/armvrt/sha256sums
          if-no-files-found: error
